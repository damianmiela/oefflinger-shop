services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "3306:3306"

  wordpress:
    build:
      context: ../wordpress
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file: ../.env
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
    volumes:
      - wp_data:/var/www/html
    ports:
      - "4001:80"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - wordpress
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "4000:3000"
    environment:
      - NEXT_PUBLIC_WP_API_URL=http://localhost:4001/wp-json
      - NEXT_PUBLIC_WC_STORE_API=http://localhost:4001/wp-json/wc/store/v1
      - WP_INTERNAL_URL=http://wordpress/wp-json
      - WC_INTERNAL_STORE_URL=http://wordpress/wp-json/wc/store/v1
      - WATCHPACK_POLLING=true

volumes:
  db_data:
  wp_data:
  frontend_node_modules:
  frontend_next:
