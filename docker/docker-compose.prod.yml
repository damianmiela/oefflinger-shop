name: oefflinger

# NOTE: this is the PRODUCTION compose file, so the ${VAR:-default} fallbacks
# below are the real production URLs (cms.oefflinger.de / oefflinger.de). The
# server .env still overrides them when Compose loads it, but because Compose
# only auto-loads .env from the compose file's own folder (not the repo root)
# when invoked with `-f docker/...`, the defaults must be correct on their own —
# otherwise a build that misses .env bakes the wrong URLs into the frontend.

services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  wordpress:
    build:
      context: ../wordpress
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file: ../.env
    environment:
      WORDPRESS_DB_HOST: mysql
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://oefflinger.de,https://www.oefflinger.de}
      WP_URL: ${WP_URL:-https://cms.oefflinger.de}
      FRONTEND_URL: ${FRONTEND_URL:-https://oefflinger.de}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    volumes:
      - wp_data:/var/www/html
    ports:
      - "4001:80"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_WC_STORE_API=${NEXT_PUBLIC_WC_STORE_API:-https://cms.oefflinger.de/wp-json/wc/store/v1}
        - NEXT_PUBLIC_WP_API_URL=${NEXT_PUBLIC_WP_API_URL:-https://cms.oefflinger.de/wp-json}
        - NEXT_PUBLIC_WP_URL=${NEXT_PUBLIC_WP_URL:-https://cms.oefflinger.de}
        - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://oefflinger.de}
        - NEXT_PUBLIC_ALLOW_INDEXING=${NEXT_PUBLIC_ALLOW_INDEXING:-true}
    restart: unless-stopped
    depends_on:
      - wordpress
    env_file: ../.env
    ports:
      - "4000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_WP_API_URL=${NEXT_PUBLIC_WP_API_URL:-https://cms.oefflinger.de/wp-json}
      - NEXT_PUBLIC_WP_URL=${NEXT_PUBLIC_WP_URL:-https://cms.oefflinger.de}
      - NEXT_PUBLIC_WC_STORE_API=${NEXT_PUBLIC_WC_STORE_API:-https://cms.oefflinger.de/wp-json/wc/store/v1}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://oefflinger.de}
      - NEXT_PUBLIC_ALLOW_INDEXING=${NEXT_PUBLIC_ALLOW_INDEXING:-true}
      - WP_INTERNAL_URL=http://wordpress/wp-json
      - WC_INTERNAL_STORE_URL=http://wordpress/wp-json/wc/store/v1

volumes:
  db_data:
  wp_data:
